{% extends 'base.html' %}

{% block title %}Login — PAC UFPI{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">
                    <i class="bi bi-clipboard-data text-primary"></i><br>
                    <small class="fw-bold">PAC UFPI</small>
                </h2>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuário ou senha inválidos. Tente novamente.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuário</label>
                        <input type="text" name="username" id="id_username"
                               class="form-control" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Senha</label>
                        <div class="input-group">
                            <input type="password" name="password" id="id_password"
                                   class="form-control" required>
                            <button type="button" class="btn btn-outline-secondary"
                                    id="toggle-password" aria-label="Mostrar senha"
                                    aria-pressed="false">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    (() => {
        const password = document.getElementById("id_password");
        const toggle = document.getElementById("toggle-password");
        const icon = toggle?.querySelector("i");
        if (!password || !toggle || !icon) return;

        toggle.addEventListener("click", () => {
            const visible = password.type === "text";
            password.type = visible ? "password" : "text";
            toggle.setAttribute("aria-pressed", String(!visible));
            toggle.setAttribute("aria-label", visible ? "Mostrar senha" : "Ocultar senha");
            icon.className = visible ? "bi bi-eye" : "bi bi-eye-slash";
        });
    })();
</script>
{% endblock %}
