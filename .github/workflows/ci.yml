name: CI

# Integração Contínua do PAC UFPI.
# Executa lint, verificações do Django, checagem de migrações e testes
# a cada push e pull request para as branches dev e master (prod), além de main/develop.

on:
  push:
    branches: [master, dev, main, develop, dados-homologados]
  pull_request:
    branches: [master, dev, main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Cancela execuções anteriores da mesma ref ainda em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Chave apenas para o ambiente de CI — não usada em produção.
  SECRET_KEY: "ci-insecure-test-key-not-for-production"
  DATABASE_URL: "sqlite:///db.sqlite3"
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ruff
        run: pip install ruff

      - name: Analisar código (lint)
        run: ruff check backend

      - name: Verificar formatação (informativo)
        run: ruff format --check backend
        continue-on-error: true

  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pac_db
          POSTGRES_USER: pac_user
          POSTGRES_PASSWORD: pac_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pac_user -d pac_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pac_user:pac_password@localhost:5432/pac_db
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar projeto Django (system checks)
        working-directory: backend
        run: python manage.py check

      - name: Checar migrações pendentes
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migrações
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Coletar arquivos estáticos
        working-directory: backend
        run: python manage.py collectstatic --noinput

      - name: Executar testes
        working-directory: backend
        run: python manage.py test --verbosity 2

  frontend:
    name: Front-end React (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Analisar código (ESLint)
        run: npm run lint

      - name: Executar testes (Vitest)
        run: npm test

      - name: Executar testes de desempenho do front-end
        run: npm run test:performance

      - name: Gerar build de produção
        run: npm run build

      - name: Instalar Chromium para o Lighthouse
        run: npx playwright install --with-deps chromium

      - name: Auditar páginas principais com Lighthouse CI
        run: npm run lighthouse

      - name: Publicar relatórios do Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            frontend/lighthouse-reports
            frontend/.lighthouseci
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Fluxo completo do MVP (Playwright)
    runs-on: ubuntu-latest
    needs: [test, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pac_e2e
          POSTGRES_USER: pac_user
          POSTGRES_PASSWORD: pac_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pac_user -d pac_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAC_E2E_DATABASE_URL: postgres://pac_user:pac_password@localhost:5432/pac_e2e
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias do backend
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do frontend
        run: npm ci --no-audit

      - name: Instalar Chromium e dependencias do sistema
        run: npx playwright install --with-deps chromium

      - name: Executar jornada E2E do MVP
        run: npm run test:e2e

      - name: Publicar diagnosticos do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results/e2e
            frontend/.e2e/*.log
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Containers Docker (build e smoke test)
    runs-on: ubuntu-latest
    needs: [test, frontend, e2e]
    env:
      PORT: "8080"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar configuração efêmera dos containers
        run: cp .env.example .env

      - name: Subir serviços e aguardar healthchecks
        run: docker compose up -d --build --wait db backend frontend

      - name: Verificar aplicação e API no container
        run: |
          curl --fail --retry 10 --retry-connrefused http://localhost:8080/
          curl --fail --retry 10 --retry-connrefused http://localhost:8080/api/auth/csrf/

      - name: Publicar diagnóstico dos containers
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=200

      - name: Encerrar serviços efêmeros
        if: always()
        run: docker compose down --volumes --remove-orphans
