name: CD

# Entrega Contínua do PAC UFPI.
# Constrói as imagens Docker do Backend e Frontend e publica no GitHub Container Registry (GHCR)
# quando há push na branch master (produção), main ou uma tag de versão (vX.Y.Z).

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-quality:
    name: Gates de qualidade antes da publicação
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pac_cd
          POSTGRES_USER: pac_user
          POSTGRES_PASSWORD: pac_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pac_user -d pac_cd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pac_user:pac_password@localhost:5432/pac_cd
      DJANGO_SECRET_KEY: cd-test-only-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar e testar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          python manage.py test

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Testar e construir frontend
        working-directory: frontend
        run: |
          npm ci --no-audit
          npm run lint
          npm test
          npm run build

  verify-containers:
    name: Validação integrada das imagens
    runs-on: ubuntu-latest
    needs: verify-quality
    env:
      PORT: "8080"
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar configuração efêmera
        run: cp .env.example .env

      - name: Construir e subir a composição
        run: docker compose up -d --build --wait db backend frontend

      - name: Executar smoke tests
        run: |
          curl --fail --retry 10 --retry-connrefused http://localhost:8080/
          curl --fail --retry 10 --retry-connrefused http://localhost:8080/api/auth/csrf/

      - name: Publicar diagnóstico
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=200

      - name: Encerrar serviços efêmeros
        if: always()
        run: docker compose down --volumes --remove-orphans

  build-and-push-backend:
    name: Build e publicação da imagem do Backend
    runs-on: ubuntu-latest
    needs: verify-containers
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags e labels) - Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e push da imagem do Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-and-push-frontend:
    name: Build e publicação da imagem do Frontend
    runs-on: ubuntu-latest
    needs: verify-containers
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags e labels) - Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e push da imagem do Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
