services:
  db:
    image: postgres:16-alpine
    container_name: pac_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pac_db}
      POSTGRES_USER: ${POSTGRES_USER:-pac_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pac_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pac_user} -d $${POSTGRES_DB:-pac_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: pac_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pac_user}:${POSTGRES_PASSWORD:-pac_password}@db:5432/${POSTGRES_DB:-pac_db}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,app,0.0.0.0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000,http://127.0.0.1:8000}
      PAC_ENVIRONMENT: ${PAC_ENVIRONMENT:-development}
      ALLOW_HOMOLOGACAO_SEED: ${ALLOW_HOMOLOGACAO_SEED:-False}
      HOMOLOGACAO_TEST_PASSWORD: ${HOMOLOGACAO_TEST_PASSWORD:-}
    volumes:
      - static_data:/app/backend/staticfiles
      - media_data:/app/backend/media

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pac_pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@pac.ufpi.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_pac}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres_data:
  pgadmin_data:
  static_data:
  media_data:

